<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareerForge AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEE8FB;--surface:#FFFFFF;--ink:#2B2350;--muted:#6B6690;--line:#E3DCF6;
  --steel:#6B4FE6;--ember:#7B5CF0;--gold:#FFC857;--ok:#1E8E5A;--warn:#B7791F;--bad:#C0392B;
  --soft:#F2EDFD;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#171230;--surface:#221B45;--ink:#EEEAFF;--muted:#A9A2D0;--line:#352D61;--steel:#B0A2FF;--soft:#2C2455;--ok:#4CC38A;--warn:#E3B04B;--bad:#F07B6E}
}
:root[data-theme="dark"]{--bg:#171230;--surface:#221B45;--ink:#EEEAFF;--muted:#A9A2D0;--line:#352D61;--steel:#B0A2FF;--soft:#2C2455;--ok:#4CC38A;--warn:#E3B04B;--bad:#F07B6E}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Nunito",system-ui,sans-serif}
h1,h2,h3{font-family:"Fredoka",system-ui,sans-serif;margin:0;letter-spacing:-.02em;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.brand{font:800 20px "Fredoka";letter-spacing:-.03em;padding:0 10px 18px;display:flex;align-items:center;gap:9px}
.brand i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--steel),var(--ember));display:inline-block}
.nav-btn{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.nav-btn:hover{background:var(--soft);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--ink);color:var(--surface)}
.nav-btn:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.badge{font-size:12px;font-weight:600;background:var(--ember);color:#fff;border-radius:99px;padding:1px 8px}
.side-foot{margin-top:0;font-size:12.5px;color:var(--muted);padding:10px}
main{padding:32px clamp(16px,4vw,44px) 64px;max-width:1120px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.topbar h1{font-size:clamp(26px,4vw,38px)}
.topbar p{margin:6px 0 0;color:var(--muted)}
select,input[type=number],input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.grid{display:grid;gap:18px}
.hero{grid-template-columns:minmax(260px,340px) 1fr;align-items:stretch}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:300px;overflow:visible}
.gauge .num{font:800 54px "Fredoka";letter-spacing:-.04em;margin-top:-58px}
.gauge .cap{color:var(--muted);font-size:13.5px;max-width:260px;margin:4px auto 0}
.arc-fg{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.strip{display:grid;grid-template-columns:150px 1fr 44px;gap:12px;align-items:center;padding:7px 0}
.strip .t{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.strip .t b{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.strip small{color:var(--muted);display:block;font-size:12px;line-height:1.2}
.strip .v{font-weight:600;text-align:right}
h2{font-size:21px;margin-bottom:14px}
h3{font-size:16px}
.two{grid-template-columns:1fr 1fr}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.primary:hover{filter:brightness(.93)}
.btn.sm{padding:5px 10px;font-size:13px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted);margin:2px 4px 2px 0}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.note{font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:150px 1fr 110px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dots{display:flex;gap:6px}
.dot{all:unset;box-sizing:border-box;width:28px;height:28px;border-radius:8px;background:var(--soft);cursor:pointer;position:relative;border:1px solid transparent}
.dot.on{background:var(--steel)}
.dot.req{border-color:var(--ember)}
.dot.req::after{content:"";position:absolute;top:-5px;left:50%;width:6px;height:6px;margin-left:-3px;background:var(--ember);border-radius:50%}
.dot:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:14px;padding:18px 0;border-top:1px solid var(--line);position:relative}
.step:first-child{border-top:0}
.node{width:28px;height:28px;border-radius:50%;border:2px solid var(--steel);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface);cursor:pointer;padding:0;color:var(--steel)}
.node.done{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done h3{text-decoration:line-through;color:var(--muted)}
.step p{margin:4px 0;color:var(--muted);font-size:14px}
.task{font-size:13.5px;margin-top:6px}
.job{display:grid;grid-template-columns:1fr auto;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.job:first-child{border-top:0}
.match{text-align:center;min-width:92px}
.match b{font:800 30px "Fredoka";display:block;line-height:1}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;font-size:12.5px;color:var(--muted)}
.parts div{background:var(--soft);border-radius:8px;padding:6px 8px}
.parts b{display:block;color:var(--ink);font-size:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field input[type=range]{width:44%;accent-color:var(--ember)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;font-weight:500}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tabs-m{display:none}
.scroll{overflow-x:auto}
.fld{display:grid;gap:4px;margin-bottom:12px}.fld label{font-weight:600;font-size:14px}
.fld input{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.err{color:var(--bad);font-size:13px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.dem{display:grid;grid-template-columns:130px 1fr 120px 84px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.dem .t{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.dem .t b{display:block;height:100%;background:var(--steel);border-radius:99px}
.stat b{font:800 36px "Fredoka";display:block;line-height:1.1}
.chat{display:flex;flex-direction:column;gap:12px}
.msgs{min-height:300px;max-height:min(58vh,560px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px}
.msg{display:flex}.msg.user{justify-content:flex-end}
.msg .b{max-width:min(680px,90%);padding:11px 15px;border-radius:16px;overflow-wrap:anywhere}
.msg.user .b{background:var(--ink);color:var(--surface)}
.msg.assistant .b{background:var(--soft)}
.msg .b p{margin:0 0 8px}.msg .b p:last-child{margin:0}
.msg .b ul,.msg .b ol{margin:4px 0 8px;padding-left:22px}
.msg .b h4{margin:6px 0;font:700 15px "Fredoka",sans-serif}
.msg .b code{background:var(--surface);padding:1px 5px;border-radius:5px;font-size:13px}
.thinking{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips .btn{font-weight:500;font-size:13.5px;padding:6px 12px;border-radius:99px}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;min-height:46px;max-height:160px}
.guide h4{font:700 18px "Fredoka",sans-serif;margin:18px 0 6px}.guide h4:first-child{margin-top:0}.guide p{margin:0 0 8px}.guide ul,.guide ol{margin:4px 0 10px;padding-left:22px}.guide li{margin:3px 0}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0;min-height:36px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--ember);flex:none}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.head-row h2{margin:0}
@media (max-width:860px){.cgrid{grid-template-columns:1fr}.dem{grid-template-columns:1fr 1fr;}.dem .t{grid-column:1/-1;order:3}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px;z-index:10;border-right:0;border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .brand,.side-foot{display:none}
  .nav-btn{white-space:nowrap}
  .hero,.two{grid-template-columns:1fr}
  .strip{grid-template-columns:110px 1fr 40px}
  .row{grid-template-columns:1fr;gap:8px}
  .job{grid-template-columns:1fr}
  .parts{grid-template-columns:repeat(2,1fr)}
}


/* ---------- Auth + account ---------- */
body:not(.authed) .app,body:not(.authed) .mtop,body:not(.authed) .bottom,body:not(.authed) .sheet{display:none!important}
body.authed .auth{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.auth{min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;overflow-y:auto;
  background:radial-gradient(900px 520px at 12% 8%,#FFFFFF 0,rgba(255,255,255,0) 62%),radial-gradient(700px 500px at 90% 0,#F3EDFF 0,rgba(243,237,255,0) 60%),linear-gradient(165deg,#E7DFFF 0%,#D8CCFB 55%,#C9BBF7 100%)}
.scene{--nx:0;--ny:0;perspective:1400px;padding:24px 0 12px}
.stage{position:relative;width:1000px;max-width:100%;height:700px;margin:0 auto;transform-style:preserve-3d}
.deco,.girl,.floor{position:absolute;pointer-events:none}
.floor{left:50%;bottom:28px;width:780px;height:150px;margin-left:-390px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#E6DDFF 0,#CDBFFA 55%,#B7A5F2 100%);box-shadow:0 22px 40px -18px rgba(94,67,216,.45),inset 0 6px 0 rgba(255,255,255,.55)}
.cloud svg,.plant svg,.lamp svg,.shelf svg{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 14px rgba(110,80,210,.22))}
.c1{width:150px;left:calc(50% - 470px);top:56px;translate:calc(var(--nx)*14px) calc(var(--ny)*8px);animation:bob 7s ease-in-out infinite}
.c2{width:130px;left:calc(50% + 300px);top:104px;translate:calc(var(--nx)*-12px) calc(var(--ny)*6px);animation:bob 8s ease-in-out -2s infinite}
.lamp{width:96px;left:calc(50% + 250px);top:0;transform-origin:50% 0;animation:sway 6s ease-in-out infinite;translate:calc(var(--nx)*-6px) 0}
.shelf{width:150px;left:calc(50% + 300px);top:230px;translate:calc(var(--nx)*-8px) calc(var(--ny)*-4px)}
.p1{width:100px;left:calc(50% - 480px);bottom:76px;translate:calc(var(--nx)*-6px) 0}
.p2{width:92px;left:calc(50% + 232px);bottom:70px;translate:calc(var(--nx)*-10px) 0}
.girl{--w:193px;width:var(--w);height:560px;left:calc(50% - 190px - var(--w)*.8);bottom:40px;z-index:6;translate:calc(var(--nx)*-10px) calc(var(--ny)*-5px);animation:bob 6s ease-in-out infinite}
.girl img{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 18px 16px rgba(80,50,170,.28))}
.cardwrap{position:absolute;left:50%;top:50%;width:380px;margin:-310px 0 0 -190px;z-index:5}
.card3d{position:relative;padding:50px 28px 22px;border-radius:44px;background:linear-gradient(180deg,#FFFFFF 0%,#FBF8FF 100%);color:var(--ink);
  box-shadow:0 40px 70px -26px rgba(94,67,216,.5),0 12px 22px -10px rgba(94,67,216,.25),inset 0 3px 0 #fff,inset 0 -8px 0 rgba(150,125,235,.12);
}
.tile{position:relative;width:84px;height:84px;margin:-92px auto 14px;border-radius:26px;display:grid;place-items:center;
  background:linear-gradient(145deg,#B3A2FF,#7A5CF0 70%);box-shadow:0 18px 24px -10px rgba(94,67,216,.65),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -8px 0 rgba(60,30,170,.28);transform:rotate(-4deg) translateZ(30px);animation:bob 5s ease-in-out infinite}
.tile>svg{width:50px;height:50px}
.tile .star{position:absolute;right:-10px;top:-12px;width:26px;height:26px;filter:drop-shadow(0 4px 4px rgba(200,140,20,.35))}
.wt{font-size:30px;text-align:center;color:#3A2C7A;margin:0}
.ws{text-align:center;color:#8A83AE;margin:2px 0 18px;font-size:14px}
.af{position:relative;margin-bottom:14px}
.af .ic{position:absolute;left:17px;top:15px;width:22px;height:22px;color:#8C74FF;pointer-events:none}
.af input{width:100%;height:52px;border:0;border-radius:20px;background:#F3EFFD;padding:0 48px 0 48px;font:inherit;font-size:16px;color:#2B2350;box-shadow:inset 0 3px 7px rgba(94,67,216,.14),0 1px 0 #fff}
.af input::placeholder{color:#A69FC6}
.af input:focus{outline:3px solid #8C74FF;outline-offset:1px;background:#fff}
.af input[aria-invalid="true"]{outline:2px solid var(--bad)}
.af .err{margin:5px 0 0 16px} 
.eye{all:unset;position:absolute;right:6px;top:6px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:#8C74FF;border-radius:14px}
.eye svg{width:22px;height:22px}.eye .slash{display:none}.eye[aria-pressed="true"] .slash{display:block}
.eye:focus-visible{outline:3px solid #8C74FF}
.forgot{text-align:right;margin:-4px 6px 14px}
.linkbtn{all:unset;cursor:pointer;color:#6F52EA;font-weight:700;font-size:13.5px}
.linkbtn:hover{text-decoration:underline}
.linkbtn:focus-visible{outline:3px solid #8C74FF;outline-offset:2px;border-radius:4px}
.go{width:100%;height:56px;border:0;border-radius:99px;cursor:pointer;color:#fff;font:600 19px "Fredoka",sans-serif;letter-spacing:.2px;
  background:linear-gradient(180deg,#A592FF,#7457EE);box-shadow:0 6px 0 #5B3FD4,0 18px 24px -8px rgba(94,67,216,.6),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .08s,box-shadow .08s}
.go:hover{filter:brightness(1.04)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #5B3FD4,0 8px 14px -8px rgba(94,67,216,.6),inset 0 2px 0 rgba(255,255,255,.45)}
.go:disabled{opacity:.7;cursor:wait}
.go:focus-visible,.gbtn:focus-visible{outline:3px solid #3A2C7A;outline-offset:3px}
.or{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:#9A94BC;font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:#E7E1F7}
.gbtn{width:100%;height:52px;border-radius:99px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#3A2C7A;font:700 15px "Nunito",sans-serif;
  box-shadow:0 4px 0 #E4DCF7,0 12px 18px -10px rgba(94,67,216,.4),inset 0 1px 0 #fff}
.gbtn svg{width:22px;height:22px}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E4DCF7}
.foot{text-align:center;color:#8A83AE;font-size:13.5px;margin:16px 0 0}
.pnote{text-align:center;color:#A39DC4;font-size:11.5px;line-height:1.4;margin:12px 4px 0}
.hint{color:#8A83AE;font-size:12.5px;margin:-4px 8px 12px}
.formerr{background:color-mix(in srgb,var(--bad) 12%,#fff);color:#B03A2E;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .auth{background:radial-gradient(800px 500px at 15% 5%,#3A2F78 0,rgba(58,47,120,0) 60%),linear-gradient(165deg,#241C4D,#181236)}
  :root:not([data-theme="light"]) .floor{background:radial-gradient(ellipse at 50% 30%,#4A3C92,#35296F 60%,#2A2058)}}
@media (max-width:1040px){.stage{width:900px}.girl{--w:160px;height:464px}.p1{left:calc(50% - 440px)}.shelf,.c2{display:none}.lamp{left:calc(50% + 215px)}}
@media (max-width:820px){
  .scene{padding:0 0 24px}
  .stage{width:100%;height:auto;padding:150px 16px 10px}
  .floor,.shelf,.c2,.p1,.lamp{display:none}
  .c1{left:12px;top:14px;width:110px}
  .p2{display:block;left:auto;right:6px;bottom:auto;top:-0px;width:0;height:0;overflow:hidden}
  .girl{left:max(14px,calc(50% - 190px + 10px));top:4px;bottom:auto;width:104px;height:142px;overflow:hidden}
  .girl{-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
  .girl img{height:auto;width:104px;object-fit:initial}
  .cardwrap{position:relative;left:auto;top:auto;margin:0 auto;width:min(380px,100%)}
  .card3d{transform:none!important;padding:48px 22px 20px}
}
@media (prefers-reduced-motion:reduce){.girl,.cloud,.lamp,.tile{animation:none!important}.card3d{transition:none}}
.acct{display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid var(--line);margin-top:auto}
.acct .who{min-width:0;flex:1;line-height:1.25}
.acct .who b,.acct .who span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#B3A2FF,#7A5CF0);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:14px;flex:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
nav.side .acct{flex-wrap:wrap}nav.side .acct .btn{width:100%;margin-top:4px}
.sheet-body .acct{margin:0 0 6px;border-top:0;border-bottom:1px solid var(--line);padding:4px 4px 12px}

/* ---------- Device layouts ---------- */
html{-webkit-text-size-adjust:100%}
main{min-width:0}.chat,.chips,.msgs{min-width:0;max-width:100%}
.mtop,.bottom{display:none}
.stats3{grid-template-columns:repeat(3,1fr)}
.sheet{position:fixed;inset:0;z-index:40}.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(10,16,24,.5)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:4px;border-top:1px solid var(--line)}
.sheet-body .nav-btn{min-height:50px;font-size:16px}
@media (min-width:861px) and (max-width:1100px){
  .app{grid-template-columns:200px 1fr}
  .hero{grid-template-columns:1fr}
  main{padding-left:28px;padding-right:28px}
}
@media (min-width:861px){.sheet{display:none!important}}
@media (pointer:coarse){.btn{min-height:44px}.btn.sm{min-height:40px}.nav-btn{min-height:44px}}
@media (max-width:860px){
  nav.side{display:none}

<script>
/* ---------- Demo data (fictional) ---------- */
const ROLES = {
  fullstack:{name:"MERN Full Stack Developer",alias:"full stack web developer software engineer sde mern mean react node",about:"Builds both the screens users see and the server and database behind them, usually with React, Node.js and MongoDB.",reqs:[
    ["HTML",3],["CSS",3],["JavaScript",4],["Git",3],["React",4],["Node.js",3],["Express.js",3],["MongoDB",3],["REST APIs",3],["Authentication",3],["Docker",2]]},
  frontend:{name:"Frontend Developer",alias:"front end web ui react angular vue developer",about:"Turns designs into fast, accessible web pages and apps that people use in the browser.",reqs:[
    ["HTML",3],["CSS",4],["JavaScript",4],["Git",3],["React",4],["Responsive Design",3],["REST APIs",2],["Accessibility",2],["Testing",2]]},
  backend:{name:"Backend Engineer (Java)",alias:"java spring api server backend developer",about:"Builds the services, databases and APIs that power applications behind the scenes.",reqs:[
    ["Git",3],["Java",4],["SQL",4],["REST APIs",4],["Spring Boot",3],["Authentication",3],["Docker",3],["System Design",2]]},
  data:{name:"Data Analyst",alias:"analytics business intelligence bi power bi reporting excel sql",about:"Collects and cleans data, finds patterns, and explains them through charts and reports so teams can decide.",reqs:[
    ["Excel",3],["SQL",4],["Python",4],["Statistics",3],["Pandas",3],["Data Visualization",3],["Machine Learning",2]]},
  ml:{name:"Machine Learning Engineer",alias:"machine learning ai data scientist deep learning artificial intelligence ml",about:"Trains and deploys models that learn from data, such as recommendations, predictions or language tools.",reqs:[
    ["Python",4],["Statistics",3],["SQL",3],["Pandas",3],["Git",3],["Machine Learning",4],["Deep Learning",2]]},
  devops:{name:"DevOps Engineer",alias:"sre cloud aws azure infrastructure site reliability platform",about:"Automates how software is built, tested, deployed and monitored so releases are fast and reliable.",reqs:[
    ["Linux",3],["Git",3],["Scripting",3],["Networking",2],["Docker",4],["CI/CD",3],["Cloud (AWS)",3],["Kubernetes",2]]},
  cyber:{name:"Cybersecurity Analyst",alias:"security ethical hacking soc infosec cyber penetration tester",about:"Protects systems and data by watching for threats, finding weaknesses and responding to incidents.",reqs:[
    ["Networking",3],["Linux",3],["Security Fundamentals",4],["Scripting",3],["Incident Response",2],["Cryptography",2]]},
  uiux:{name:"UI/UX Designer",alias:"ux ui designer product design figma user experience interface",about:"Researches what users need and designs clear, usable screens and flows for apps and websites.",reqs:[
    ["Design Fundamentals",4],["Figma",4],["User Research",3],["Prototyping",3],["Accessibility",2],["HTML",2],["CSS",2]]},
  qa:{name:"QA / Test Engineer",alias:"tester testing quality assurance automation sdet selenium",about:"Finds bugs before users do by planning tests, automating them and checking that software works as promised.",reqs:[
    ["Testing",4],["Bug Reporting",3],["SQL",2],["Git",3],["REST APIs",3],["JavaScript",2],["Test Automation",3]]},
  mobile:{name:"Mobile App Developer",alias:"android ios flutter kotlin app developer react native",about:"Builds apps for phones, from screens and offline storage to talking with servers.",reqs:[
    ["Git",3],["Kotlin",3],["Android",4],["UI Design",2],["REST APIs",3],["SQL",2]]}
};
const TASKS = {
  "Express.js":["Build a CRUD API with routes, middleware and error handling","Add an Express backend to your Campus Marketplace project"],
  "REST APIs":["Design 6 endpoints with correct status codes and pagination","Publish API docs with example requests for your project"],
  "Authentication":["Implement register/login with bcrypt and JWT refresh tokens","Protect two routes of your project with role-based access"],
  "Docker":["Containerise a Node app with a Dockerfile","Run app + database together with docker-compose"],
  "Node.js":["Read/write files and build a small CLI with async/await","Move business logic of a project into a Node service"],
  "React":["Build a form-heavy page with hooks and controlled inputs","Add routing and API data fetching to a project"],
  "SQL":["Solve 25 JOIN/GROUP BY problems","Design a normalised schema for a small project"],
  "Python":["Solve 30 problems using lists, dicts and functions","Write a script that cleans and summarises a CSV"]
};
const JOBS = [
 {id:1,title:"Junior Full Stack Developer",co:"Kaveri Labs",loc:"Madurai",mode:"Hybrid",lpa:"5–7",min:6.5,req:["JavaScript","React","Node.js","MongoDB","REST APIs"],pref:["Docker","Git"]},
 {id:2,title:"Software Engineer Trainee",co:"Nilgiri Payments",loc:"Chennai",mode:"On-site",lpa:"6–8",min:7,req:["JavaScript","Node.js","Express.js","REST APIs","Authentication"],pref:["Docker"]},
 {id:3,title:"Frontend Developer",co:"Vaigai Digital",loc:"Remote",mode:"Remote",lpa:"4–6",min:6,req:["HTML","CSS","JavaScript","React","Git"],pref:[]},
 {id:4,title:"Backend Developer (Node)",co:"Sahyadri Cloud",loc:"Bengaluru",mode:"Hybrid",lpa:"8–11",min:7.5,req:["Node.js","Express.js","MongoDB","Authentication","Docker"],pref:["REST APIs"]},
 {id:5,title:"Data Analyst Intern",co:"Thamirabarani Analytics",loc:"Coimbatore",mode:"On-site",lpa:"3–4",min:6.5,req:["SQL","Excel","Python","Data Visualization"],pref:["Statistics"]},
 {id:6,title:"Associate Java Developer",co:"Cauvery Systems",loc:"Chennai",mode:"On-site",lpa:"5–7",min:7,req:["Java","SQL","Spring Boot","REST APIs"],pref:["Git"]},
 {id:7,title:"MERN Stack Intern",co:"Pandiyan Tech Studio",loc:"Remote",mode:"Remote",lpa:"3–5",min:6,req:["JavaScript","React","Node.js","MongoDB"],pref:["Git"]}
];
const PROJECTS = [
  {name:"Campus Marketplace",tech:["React","Node.js","MongoDB","JavaScript"]},
  {name:"Expense Tracker",tech:["HTML","CSS","JavaScript"]},
  {name:"Attendance Analyzer",tech:["Python","SQL","Excel"]}
];
const CATS = [
 ["tech","Technical skills"],["projects","Projects"],["academics","Academics"],["coding","Coding / DSA"],
 ["resume","Resume"],["certs","Certifications"],["interview","Interview prep"],["soft","Soft skills"]
];
const DEFAULT_WEIGHTS={tech:25,projects:15,academics:10,coding:15,resume:10,certs:5,interview:10,soft:10};

/* ---------- State ---------- */
const DEMO={levels:{HTML:4,CSS:3,JavaScript:4,Git:3,React:3,"Node.js":2,"Express.js":1,MongoDB:3,"REST APIs":1,Authentication:0,Docker:0,
          Python:2,SQL:3,Java:2,Excel:2,Statistics:1,Pandas:1,"Data Visualization":1,"Machine Learning":0,"Spring Boot":0,"System Design":0},
  prof:{cgpa:7.8,solved:112,certs:2,resume:74,interview:61,soft:70,pref:"Hybrid",city:"Madurai"}};
const blank = email => ({
  role:"fullstack", view:"connect", targetSet:false, customRoles:{}, guides:{}, levels:{}, projects:[],
  prof:{cgpa:0,solved:0,certs:0,resume:0,interview:0,soft:0,pref:"Hybrid",city:""},
  weights:{...DEFAULT_WEIGHTS}, done:{}, saved:[], applied:{}, q:"", mode:"All", connErr:{}, chat:[],
  connect:{done:false,email:email||"",gh:{user:"",linked:false,repos:0,stars:0,commits:0,langs:""},lc:{user:"",linked:false,easy:0,medium:0,hard:0,streak:0},li:{url:"",linked:false,checks:{}}}
});
let S=blank(""), USER=null;
const save=()=>{if(!USER)return;try{localStorage.setItem("cf_state_v3_"+USER.email,JSON.stringify(S))}catch(e){}};

/* ---------- Engine ---------- */
const lvl=s=>{const v=S.levels[s];return Number.isFinite(v)?v:0};
const clamp=v=>Math.max(0,Math.min(1,v));
const role=()=>allRoles()[S.role]||ROLES.fullstack;
function catScores(){
  const r=role().reqs;
  const tech=r.reduce((a,[s,n])=>a+clamp(lvl(s)/n),0)/r.length;
  const techSet=new Set(r.map(x=>x[0]));
  const hit=S.projects.filter(p=>p.tech.some(t=>techSet.has(t))).length;
  const covered=new Set(S.projects.flatMap(p=>p.tech).filter(t=>techSet.has(t))).size;
  let projects=clamp(0.5*hit/3+0.5*covered/Math.max(4,techSet.size*0.6));
  if(S.connect.gh.linked) projects=clamp(0.75*projects+0.25*clamp((+S.connect.gh.repos||0)/8));
  return {tech,projects,academics:clamp(S.prof.cgpa/10),coding:codingScore(),
    resume:clamp(S.prof.resume/100),certs:clamp(S.prof.certs/4),interview:clamp(S.prof.interview/100),soft:clamp(S.prof.soft/100)};
}
function overall(){
  const c=catScores(), w=S.weights, tot=Object.values(w).reduce((a,b)=>a+b,0)||1;
  return CATS.reduce((a,[k])=>a+c[k]*w[k],0)/tot;
}
function gaps(){
  return role().reqs.map(([s,n],i)=>({skill:s,req:n,cur:lvl(s),gap:Math.max(0,n-lvl(s)),order:i}));
}
function status(g){return g.gap===0?["Ready","ok"]:g.cur===0?["Missing","bad"]:["In progress","warn"]}
function roadmap(){ // dependency order from role list; priority from size of gap
  const base=gaps().filter(g=>g.gap>0||(S.done[S.role]||{})[g.skill]!==undefined);
  return base.map((g,i)=>{
    const d=(S.done[S.role]||{})[g.skill]; const orig=d!==undefined?d.req-(d.req-d.prev):g.cur;
    const cur=d!==undefined?d.prev:g.cur, gap=Math.max(0,g.req-cur);
    return {skill:g.skill,req:g.req,cur,gap,done:d!==undefined,weeks:Math.max(1,Math.round(gap*1.5)),
      priority:gap>=3?"High":gap===2?"Medium":"Low",task:TASKS[g.skill]||[`Complete a guided tutorial on ${g.skill}`,`Use ${g.skill} in one of your projects`]};
  });
}
function match(job){
  const sk=job.req.reduce((a,s)=>a+clamp(lvl(s)/3),0)/job.req.length;
  const prefBonus=job.pref.length?job.pref.reduce((a,s)=>a+clamp(lvl(s)/2),0)/job.pref.length:1;
  const skill=clamp(0.85*sk+0.15*prefBonus);
  const proj=job.req.filter(s=>S.projects.some(p=>p.tech.includes(s))).length/job.req.length;
  const edu=S.prof.cgpa>=job.min?1:clamp(1-(job.min-S.prof.cgpa)/2);
  const pref=(job.mode===S.prof.pref?0.5:job.mode==="Remote"?0.4:0.15)+(job.loc===S.prof.city||job.mode==="Remote"?0.5:0.1);
  const total=0.5*skill+0.2*proj+0.15*edu+0.15*pref;
  const matched=job.req.filter(s=>lvl(s)>=3), missing=job.req.filter(s=>lvl(s)<3);
  return {total,skill,proj,edu,pref:clamp(pref),matched,missing};
}

const FAMILY={1:"fullstack",2:"fullstack",3:"fullstack",4:"fullstack",5:"data",6:"backend",7:"fullstack"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lcTotal=()=>{const l=S.connect.lc;return (+l.easy||0)+(+l.medium||0)+(+l.hard||0)};
function codingScore(){const l=S.connect.lc;
  if(l.linked) return clamp(((+l.easy||0)+2*(+l.medium||0)+4*(+l.hard||0))/450);
  return clamp(S.prof.solved/300);}
const levelOf=v=>v<0.4?"Beginner":v<0.7?"Average":"Advanced";
const levelCls=v=>v<0.4?"bad":v<0.7?"warn":"ok";
const skillLevelName=n=>n===0?"Not started":n<=2?"Beginner":n===3?"Average":"Advanced";
const skillLevelCls=n=>n<=2?"bad":n===3?"warn":"ok";
const allRoles=()=>Object.assign({},ROLES,S.customRoles||{});
const SAFE=/[^A-Za-z0-9 .+#\/()-]/g;
const BADNAMES=new Set(["constructor","prototype","__proto__","tostring","valueof","hasownproperty"]);
const cleanName=(t,n)=>String(t==null?"":t).replace(SAFE,"").replace(/\s+/g," ").trim().slice(0,n);
function cleanRole(raw,fallbackName,min){
  const name=cleanName(raw&&raw.name||fallbackName,60);
  const about=String(raw&&raw.about||"").replace(/[<>]/g,"").replace(/\s+/g," ").trim().slice(0,240);
  const seen=new Set(),reqs=[];
  for(const it of ((raw&&raw.reqs)||[])){
    const sk=cleanName(Array.isArray(it)?it[0]:it&&it.skill,40),lv=Math.round(+(Array.isArray(it)?it[1]:it&&it.level));
    if(!sk||BADNAMES.has(sk.toLowerCase())||seen.has(sk.toLowerCase()))continue;
    seen.add(sk.toLowerCase());reqs.push([sk,Math.min(5,Math.max(1,lv||3))]);
    if(reqs.length>=12)break;
  }
  if(!name||reqs.length<min)return null;
  return {name,about,reqs,custom:true};
}
function relatedJobs(r){
  const ns=new Set(r.reqs.map(x=>normS(x[0])));
  return JOBS.filter(j=>j.req.filter(s=>ns.has(normS(s))).length/j.req.length>=0.5);
}
function careerRank(){
  const rs=Object.entries(allRoles()).map(([k,r])=>({k,r,jobs:relatedJobs(r).length}));
  const max=Math.max(1,...rs.map(x=>x.jobs));
  return rs.map(({k,r,jobs})=>{
    const fit=r.reqs.reduce((a,[s,n])=>a+clamp(lvl(s)/n),0)/r.reqs.length;
    return {key:k,name:r.name,fit,jobs,score:0.75*fit+0.25*jobs/max,
      have:r.reqs.filter(([s,n])=>lvl(s)>=n).map(x=>x[0]),
      lack:r.reqs.filter(([s,n])=>lvl(s)<n).sort((a,b)=>(b[1]-lvl(b[0]))-(a[1]-lvl(a[0]))).map(x=>x[0])};
  }).sort((a,b)=>b.score-a.score);
}
const CAT_ACT={tech:"Close your biggest skill gap first (see Roadmap)",projects:"Ship one deployed project that uses the core stack of your target role",
  academics:"Clear backlogs and lift your next-semester marks; many companies filter on CGPA",coding:"Practise data-structure problems in weekly sets",
  resume:"Rewrite your resume with one measurable result per project",certs:"Earn one recognised certificate tied to your target role",
  interview:"Take a mock interview each week and review the concepts you missed",soft:"Practise explaining each project aloud in two minutes"};
function actions(){
  const c=S.connect,out=[],cs=catScores(),add=(t,why)=>out.push({t,why});
  if(!c.gh.linked)add("Connect your GitHub","Recruiters check it early, and your repositories then count toward the Projects score.");
  else{
    if(c.gh.repos<4)add("Publish at least 4 project repositories, each with a README",`You reported ${c.gh.repos} public repos.`);
    if(c.gh.commits<30)add("Commit on at least 3 days a week",`You reported ${c.gh.commits} commits in the last 90 days.`);
  }
  if(!c.lc.linked)add("Connect your LeetCode","Coding practice feeds your score and is a screening step at many companies.");
  else{
    if(c.lc.medium<20)add("Solve 2 medium problems a week",`${c.lc.medium} medium problems solved so far.`);
    if(c.lc.hard===0&&cs.coding>0.4)add("Attempt one hard problem a week","No hard problems yet, and advanced roles ask for them.");
    if(c.lc.streak<5)add("Build a daily streak","Twenty minutes every day beats one long weekend session.");
  }
  add(c.li.linked?"Match your LinkedIn headline to your target role":"Add your LinkedIn URL","Recruiters search by role and skill keywords, so keep it consistent with your resume.");
  const weak=CATS.map(([k,n])=>({k,n,v:cs[k]})).sort((a,b)=>a.v-b.v).slice(0,3);
  weak.forEach(w=>add(CAT_ACT[w.k],`${w.n} is at ${pct(w.v)}%.`));
  return out;
}

function saveConnect(){
  const c=S.connect,err={};
  c.email=c.email.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email))err.email="Enter a valid email address, like name@college.edu.";
  c.gh.user=parseGh(c.gh.user);c.lc.user=parseLc(c.lc.user);c.li.url=c.li.url.trim();if(c.li.url&&!/^https?:/i.test(c.li.url))c.li.url="https://"+c.li.url;
  if(c.gh.user&&!/^[a-z\d](?:[a-z\d]|-(?=[a-z\d])){0,38}$/i.test(c.gh.user))err["gh.user"]="Use letters, numbers and single hyphens, up to 39 characters.";
  if(c.lc.user&&!/^[A-Za-z0-9_-]{3,30}$/.test(c.lc.user))err["lc.user"]="Use 3–30 letters, numbers, hyphens or underscores.";
  if(c.li.url&&!/^https?:\/\/([a-z]{2,3}\.)?linkedin\.com\/in\/[A-Za-z0-9\-_%]{3,100}\/?$/i.test(c.li.url))err["li.url"]="Use a link like https://www.linkedin.com/in/your-name.";
  if(Object.keys(err).length){S.connErr=err;render();toast("Fix the highlighted fields");return}
  ["repos","commits","stars"].forEach(k=>c.gh[k]=Math.max(0,Math.round(+c.gh[k]||0)));
  ["easy","medium","hard","streak"].forEach(k=>c.lc[k]=Math.max(0,Math.round(+c.lc[k]||0)));
  c.gh.linked=!!c.gh.user;c.lc.linked=!!c.lc.user;c.li.linked=!!c.li.url;c.done=true;S.connErr={};
  toast("Saved. Reviewing your profiles…");go(S.targetSet?"guidance":"target");
}

function md(t){
  const inl=x=>x.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  let out="",list=null;const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const raw of esc(t).split("\n")){
    const l=raw.trimEnd();let m;
    if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=="ul"){close();out+="<ul>";list="ul"}out+=`<li>${inl(m[1])}</li>`}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){close();out+="<ol>";list="ol"}out+=`<li>${inl(m[1])}</li>`}
    else if(m=l.match(/^#{1,4}\s+(.*)/)){close();out+=`<h4>${inl(m[1])}</h4>`}
    else if(!l.trim()){close()}
    else{close();out+=`<p>${inl(l)}</p>`}
  }
  close();return out;
}
function localAnswer(q){
  const t=q.toLowerCase(),cs=catScores(),rank=careerRank(),best=rank[0],lack=best.lack.slice(0,4).join(", ")||"advanced topics in your stack";
  if(/start|begin|scratch|fresher|no idea|dont know|don't know|zero/.test(t))
    return `**Start here**\n1. Pick one direction for now. **${best.name}** fits your current skills best.\n2. This week, spend 20 minutes a day on **${best.lack[0]||"your next topic"}**.\n3. Learn in this order: ${lack}.\n4. After each topic, build something tiny with it and put it on GitHub.\n5. Add 2 easy coding problems a week once you feel comfortable.\n\nYou can change direction later. Ask about any step and I'll break it down.`;
  if(/career|role|suit|which job|path/.test(t))
    return `Based on your skills today, your closest paths are:\n${rank.map(r=>`- **${r.name}**: ${pct(r.fit)}% skills fit`).join("\n")}\n\nOpen **Career guidance** to see the gaps behind each one.`;
  if(/dsa|leetcode|coding|problem|algorithm/.test(t))
    return `Your coding score is ${pct(cs.coding)}% (${levelOf(cs.coding)}). Start with arrays and strings, then hash maps, then recursion. Aim for 2 to 3 problems a week, and re-solve the ones you got wrong after a few days.`;
  if(/resume|cv/.test(t))
    return `Keep your resume to one page. For each project write what you built, the tools you used, and one measurable result. List skills that match the job you're applying to, and don't include anything you can't discuss in an interview.`;
  if(/project/.test(t))
    return `Build one project that uses the core stack of **${best.name}**, deploy it, and write a README with screenshots and setup steps. One finished project beats five half-done ones.`;
  if(/interview/.test(t))
    return `Your interview preparation is at ${pct(cs.interview)}%. Explain your projects aloud in two minutes, revise fundamentals of your top skills, and practise a few common questions each week.`;
  if(/score|readiness|level/.test(t))
    return `Your readiness is ${pct(overall())}% (${levelOf(overall())}). Weakest areas: ${CATS.map(([k,n])=>({n,v:cs[k]})).sort((a,b)=>a.v-b.v).slice(0,3).map(x=>`${x.n} ${pct(x.v)}%`).join(", ")}.`;
  return `I can answer these without the AI coach: where to start, which career fits, coding practice, resume, projects, interviews, and your score. Try one of those.`;
}

async function send(q){
  q=(q||"").trim();if(!q||streaming)return;
  if(S.view!=="coach"){S.view="coach";render();window.scrollTo({top:0})}
  S.chat.push({role:"user",content:q.slice(0,1500)});addBubble("user",q);
  const box=document.getElementById("coachInput");if(box)box.value="";
  const bub=addBubble("assistant","",true);setBusy(true);
  let out="";
  if(!SAMPLE){out=localAnswer(q);bub.classList.remove("thinking");bub.innerHTML=md(out)}
  else{
    const ctl=new AbortController();streaming=ctl;
    const hist=S.chat.slice(-11);while(hist.length&&hist[0].role!=="user")hist.shift();
    try{
      const r=await SAMPLE([{role:"user",content:COACH_RULES+"\n\nSTUDENT CONTEXT:\n"+coachContext()},...hist],
        {cache:false,signal:ctl.signal,onText:({text})=>{if(bub.isConnected){bub.classList.remove("thinking");bub.innerHTML=md(text);scrollChat()}}});
      out=r.text||"";
    }catch(e){
      out=e.text||"";
      const why=e.code==="cancelled"?"(Stopped.)":e.code==="rate_limited"?"Too many questions at once. Wait a moment and try again."
        :e.code==="not_granted"?"Claude access was declined for this page. Allow it and ask again. In the meantime:\n\n"+localAnswer(q)
        :"The coach couldn't answer just now. In the meantime:\n\n"+localAnswer(q);
      out=out?out+"\n\n"+(e.code==="cancelled"?why:""):why;
      if(bub.isConnected){bub.classList.remove("thinking");bub.innerHTML=md(out)}
    }
    streaming=null;
  }
  S.chat.push({role:"assistant",content:out||"(No answer.)"});
  if(S.chat.length>40)S.chat=S.chat.slice(-40);
  setBusy(false);save();
  const sb=document.getElementById("coachClear");
}

async function submitAuth(){
  if(authBusy)return;
  const val=id=>{const el=document.getElementById(id);return el?el.value:""};
  const email=val("a_email").trim().toLowerCase(),pw=val("a_pw"),m=authMode;
  authVals.email=val("a_email").trim();if(m==="signup")authVals.name=val("a_name").trim();
  if(m==="google"){
    authErr={};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){authErr={a_email:"Enter the Google email you want to use."};return renderAuth()}
    const acc=getAcc(),a=acc[email];
    if(a&&a.salt){authErr={a_email:"This email already has a password. Log in with your password."};return renderAuth()}
    if(!a){const nm=email.split("@")[0].replace(/[._-]+/g," ").replace(/\b\w/g,c=>c.toUpperCase()).slice(0,60)||"Student";
      acc[email]={name:nm,provider:"google",created:Date.now()};
      if(!putAcc(acc)){authErr={form:"Your browser is blocking storage, so the account can't be saved."};return renderAuth()}}
    authVals={name:"",email:""};return startSession(email,acc[email].name);
  }
  const err={};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))err.a_email="Enter a valid email address, like name@college.edu.";
  if(m==="signin"){if(!pw)err.a_pw="Enter your password."}
  else{
    if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw))err.a_pw="Use at least 8 characters with a letter and a number.";
    else if(pw!==val("a_pw2"))err.a_pw2="The passwords don't match.";
    if(m==="signup"&&(authVals.name.length<2||authVals.name.length>60))err.a_name="Enter your name, 2 to 60 characters.";
  }
  authErr=err;
  if(Object.keys(err).length)return renderAuth();
  if(!(window.crypto&&crypto.subtle)){authErr={form:"This browser can't secure passwords here. Open the page in an up-to-date browser."};return renderAuth()}
  authBusy=true;renderAuth();
  try{
    const acc=getAcc();
    if(m==="signin"){
      const f=fails[email];
      if(f&&f.until>Date.now()){authErr={form:`Too many attempts. Try again in ${Math.ceil((f.until-Date.now())/1000)} seconds.`}}
      else{
        const a=acc[email];
        if(a&&!a.salt){authBusy=false;authErr={form:"This account uses Google. Tap Continue with Google instead."};return renderAuth()}
        const h=await hashPw(pw,a?a.salt:"AAAAAAAAAAAAAAAAAAAAAA==");
        if(a&&h===a.hash){delete fails[email];authBusy=false;authErr={};return startSession(email,a.name)}
        const c=(fails[email]=fails[email]||{n:0,until:0});c.n++;if(c.n>=5){c.n=0;c.until=Date.now()+30000}
        authErr={form:"The email or password is incorrect."};
      }
    }else if(m==="signup"){
      if(acc[email])authErr={a_email:"An account with this email already exists. Sign in instead."};
      else{
        const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));
        acc[email]={name:authVals.name,salt,hash:await hashPw(pw,salt),created:Date.now()};
        if(!putAcc(acc))authErr={form:"Your browser is blocking storage, so the account can't be saved."};
        else{authBusy=false;authErr={};authVals={name:"",email:""};startSession(email,acc[email].name);toast("Account created. Let's set you up.");return}
      }
    }else{
      const a=acc[email];
      if(!a)authErr={a_email:"No account with this email was found on this device."};
      else if(!a.salt)authErr={a_email:"This account uses Google, so it has no password to reset."};
      else{const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));a.salt=salt;a.hash=await hashPw(pw,salt);
        if(!putAcc(acc))authErr={form:"Your browser is blocking storage."};
        else{authMode="signin";authErr={};authBusy=false;renderAuth();toast("Password updated. Sign in with it.");return}}
    }
  }catch(x){authErr={form:"Something went wrong. Try again."}}
  authBusy=false;renderAuth();
}

  if(g.repos<4)tips.push(`Publish ${4-g.repos} more project repo${4-g.repos>1?"s":""}, each with a README and screenshots.`);
  if(g.commits<30)tips.push("Commit on at least 3 days a week. Aim for 30 or more commits in 90 days.");
  if(!rel)tips.push(`Build a project in a skill your target role needs, such as ${role().reqs.slice(0,3).map(x=>x[0]).join(", ")}.`);
  if(g.stars<3)tips.push("Share your best project with classmates and on LinkedIn to earn your first stars.");
  if(!tips.length)tips.push("Strong profile. Pin your best 3 repos and keep a README with a live link on each.");
  return {name:"GitHub",score,tips:tips.slice(0,3),facts:`${g.repos} repos · ${g.commits} commits (90 days) · ${g.stars} stars`};
}
function perfLeet(){
  const l=S.connect.lc;if(!l.linked)return null;
  const tips=[];
  if(l.medium<20)tips.push(`Solve 2 medium problems a week. You have ${l.medium} so far.`);
  if(l.hard===0)tips.push("Try one hard problem a week once mediums feel comfortable.");
  if(l.streak<5)tips.push("Build a daily streak. Twenty minutes a day beats one long weekend.");
  if(!tips.length)tips.push("Great consistency. Practise explaining your approach aloud, as interviews ask for it.");
  return {name:"LeetCode",score:codingScore(),tips:tips.slice(0,3),facts:`${l.easy} easy · ${l.medium} medium · ${l.hard} hard · ${l.streak}-day streak`};
}
function perfLinked(){
  const li=S.connect.li;if(!li.linked)return null;
  const ck=li.checks||{},miss=LI_CHECKS.filter(([k])=>!ck[k]);
  const T={photo:"Add a clear, friendly profile photo.",headline:`Change your headline to say ${role().name} plus 2 key skills.`,about:"Write 3 to 4 lines in About on what you're learning and building.",projects:"List your best projects with links.",skills:"Add at least 10 skills that match your target role.",experience:"Add internships, volunteering or club work.",certs:"List the certificates you've earned.",recs:"Ask a teacher or teammate for a recommendation."};
  const tips=miss.slice(0,3).map(([k])=>T[k]);if(!tips.length)tips.push("Complete profile. Post about one project a month to stay visible to recruiters.");
  return {name:"LinkedIn",score:(LI_CHECKS.length-miss.length)/LI_CHECKS.length,tips,facts:`${LI_CHECKS.length-miss.length} of ${LI_CHECKS.length} profile checks done`};
}
function perfCardHTML(){
  const names=["GitHub","LeetCode","LinkedIn"],items=[perfGit(),perfLeet(),perfLinked()];
  return `<section class="card" style="margin-bottom:18px"><div class="head-row"><h2>How your profiles are performing</h2><button class="btn sm" data-go="connect">Update</button></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${items.map((p,i)=>p?
      `<div><div class="head-row" style="margin-bottom:4px"><h3>${p.name}</h3><span class="chip ${levelCls(p.score)}">${levelOf(p.score)} · ${pct(p.score)}%</span></div>
       <div style="height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0;box-shadow:inset 0 2px 4px rgba(94,67,216,.14)"><b style="display:block;height:100%;width:${pct(p.score)}%;background:${heat(p.score)};border-radius:99px"></b></div>
       <p class="note" style="margin:0 0 6px">${esc(p.facts)}</p><ul style="margin:0;padding-left:20px">${p.tips.map(t=>`<li style="margin:3px 0">${esc(t)}</li>`).join("")}</ul></div>`
      :`<div><h3>${names[i]}</h3><p class="note">Not connected yet. Connect it to see how it's performing and what to fix.</p><button class="btn sm" data-go="connect">Connect ${names[i]}</button></div>`).join("")}</div>
    <p class="note" style="margin:12px 0 0">Scores come from the numbers and checks you entered. They are estimates to guide your practice, not what recruiters will decide.</p></section>`;
}

/* ---------- Render + events ---------- */
const VIEWS={target:targetView,connect:connectView,overview,coach:coachView,gap:gapView,roadmap:roadmapView,guidance:guidanceView,analysis:analysisView,jobs:jobsView,profile:profileView};
function render(keepFocus){if(!USER)return;
  const focusId=document.activeElement&&document.activeElement.id;
  updateAccount();$("#main").innerHTML=VIEWS[S.view]();
  document.querySelectorAll(".nav-btn").forEach(b=>b.toggleAttribute("aria-current",b.dataset.view===S.view)||0);
  document.querySelectorAll("[data-view]").forEach(b=>{b.dataset.view===S.view?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
  const mb=document.getElementById("moreBtn");if(mb){["target","connect","gap","guidance","analysis","profile"].includes(S.view)?mb.setAttribute("aria-current","page"):mb.removeAttribute("aria-current")}
  const left=roadmap().filter(r=>!r.done).length; $("#rmBadge").textContent=left; $("#rmBadge").hidden=!left;
  const n=Object.values(S.applied).filter(a=>a!=="Withdrawn").length; $("#jobBadge").textContent=n; $("#jobBadge").hidden=!n;
  if(keepFocus&&focusId){const el=document.getElementById(focusId);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}
  save();
}
function closeSheet(back){const sh=document.getElementById("sheet"),mb=document.getElementById("moreBtn");if(!sh)return;sh.hidden=true;if(mb){mb.setAttribute("aria-expanded","false");if(back)mb.focus()}}
function toggleSheet(){const sh=document.getElementById("sheet"),mb=document.getElementById("moreBtn");if(!sh)return;
  if(sh.hidden){sh.hidden=false;mb.setAttribute("aria-expanded","true");const f=sh.querySelector("button");if(f)f.focus()}else closeSheet(true)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet(true)});
document.addEventListener("submit",e=>{if(e.target.id==="authForm"){e.preventDefault();submitAuth()}});
function go(v){closeSheet();resetArm=false;S.view=v;render();window.scrollTo({top:0})}

document.addEventListener("click",e=>{
  if(e.target.classList&&e.target.classList.contains("sheet-bg")){closeSheet(true);return}
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="moreBtn"){toggleSheet();return}
  if(t.dataset.role){return setTarget(t.dataset.role)}
  if(t.id==="buildRole") return buildRole();
  if(t.id==="genGuide") return genGuide();
  if(t.id==="stopGuide"){if(guideCtl)guideCtl.abort();return}
  if(t.id==="cancelBuild"){if(tgt.ctl)tgt.ctl.abort();return}
  if(t.id==="manualRole") return manualRole();
  if(t.dataset.signout!==undefined) return signOut();
  if(t.dataset.authMode){authMode=t.dataset.authMode;authErr={};renderAuth();return}
  if(t.id==="pwToggle"){const show=t.getAttribute("aria-pressed")!=="true";t.setAttribute("aria-pressed",show);t.setAttribute("aria-label",show?"Hide password":"Show password");["a_pw","a_pw2"].forEach(id=>{const el=document.getElementById(id);if(el)el.type=show?"text":"password"});return}
  if(t.id==="loadDemo"){Object.assign(S,{levels:{...DEMO.levels},prof:{...DEMO.prof},projects:PROJECTS.map(p=>({name:p.name,tech:[...p.tech]}))});S.targetSet=true;S.view="overview";toast("Sample profile loaded");return render()}
  if(t.id==="addProj"){
    const n=document.getElementById("pName").value.trim(),tech=[...new Set(document.getElementById("pTech").value.split(",").map(x=>x.trim()).filter(Boolean).map(canon))].slice(0,10),er=document.getElementById("pErr");
    if(n.length<2){er.textContent="Enter a project name.";return}
    if(!tech.length){er.textContent="Add at least one technology, like React.";return}
    if(S.projects.length>=12){er.textContent="You can add up to 12 projects.";return}
    S.projects.push({name:n.slice(0,60),tech});toast("Project added");return render()}
  if(t.dataset.rmproj!==undefined){S.projects.splice(+t.dataset.rmproj,1);toast("Project removed");return render()}

  if(t.dataset.view) return go(t.dataset.view);
  if(t.dataset.ask) return send(t.dataset.ask);
  if(t.id==="coachSend") return send(document.getElementById("coachInput").value);
  if(t.id==="coachStop"){if(streaming)streaming.abort();return}
  if(t.id==="coachClear"){if(!streaming){S.chat=[];render()}return}
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.skill){S.levels[t.dataset.skill]=+t.dataset.lvl;render();const b=document.querySelector(`[data-skill="${CSS.escape(t.dataset.skill)}"][data-lvl="${t.dataset.lvl}"]`);return}
  if(t.dataset.toggle){
    const s=t.dataset.toggle,d=(S.done[S.role]=S.done[S.role]||{}),req=role().reqs.find(r=>r[0]===s)[1];
    if(d[s]!==undefined){S.levels[s]=d[s].prev;delete d[s];toast(`${s} restored to level ${S.levels[s]}`)}
    else{d[s]={prev:lvl(s),req};S.levels[s]=req;toast(`${s} marked done. Readiness updated.`)}
    return render();
  }
  if(t.dataset.apply){
    const id=t.dataset.apply,j=JOBS.find(j=>j.id==id),st=S.applied[id];
    if(st&&st!=="Withdrawn"){S.applied[id]="Withdrawn";toast("Application withdrawn")}
    else{S.applied[id]="Applied";toast(`Applied to ${j.title} at ${j.co}`)}
    return render();
  }
  if(t.dataset.save){const id=+t.dataset.save;S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];toast(S.saved.includes(id)?"Job saved":"Removed from saved");return render();}
  if(t.id==="saveConn") return saveConnect();
  if(t.id==="skipConn"){S.connect.done=true;return go("overview")}
  if(t.id==="clearConn"){const d=blank("").connect;d.done=S.connect.done;S.connect=d;S.connErr={};toast("Connections cleared");return render();}
  if(t.id==="sampleConn"){if(!S.connect.email)S.connect.email="arvind@college.edu";
    Object.assign(S.connect.gh,{user:"arvind-demo",repos:5,commits:48,stars:3,langs:"JavaScript, Python"});
    Object.assign(S.connect.lc,{user:"arvind_demo",easy:42,medium:16,hard:1,streak:6});
    S.connect.li.url="https://www.linkedin.com/in/arvind-demo";S.connErr={};toast("Sample values filled. Review, then save.");return render();}
  if(t.dataset.setrole){S.role=t.dataset.setrole;toast("Target role updated");return render();}
  if(t.id==="reset"){if(!resetArm){resetArm=true;return render()}const em=S.connect.email;resetArm=false;S=blank(em);S.view="profile";toast("Your data was reset");return render();}
  if(t.id==="resetW"){S.weights={...DEFAULT_WEIGHTS};return render();}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="roleSel"){if(t.value==="__other")go("target");else{S.role=t.value;S.targetSet=true;render();}}
  else if(t.id==="modeSel"){S.mode=t.value;render();}
  else if(t.id==="prefMode"){S.prof.pref=t.value;render();}
  else if(t.dataset.chk){S.connect.li.checks=S.connect.li.checks||{};S.connect.li.checks[t.dataset.chk]=t.checked;save()}
});
let deb;
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){clearTimeout(deb);deb=setTimeout(()=>{S.q=t.value;render(true)},250)}
  else if(t.dataset.prof){const v=parseFloat(t.value);if(!isNaN(v)){S.prof[t.dataset.prof]=Math.min(+t.max,Math.max(+t.min,v));save()}}
  else if(t.dataset.w){S.weights[t.dataset.w]=+t.value;render(true)}
  else if(t.dataset.c){const p=t.dataset.c.split(".");let o=S.connect;while(p.length>1)o=o[p.shift()];o[p[0]]=t.value;save()}
  else if(t.id==="tq"){clearTimeout(deb);deb=setTimeout(()=>{tgt.q=t.value;tgt.err="";render(true)},200)}
  else if(t.id==="tm"){tgt.manual=t.value}
  else if(t.dataset.pt){S.prof[t.dataset.pt]=t.value.slice(0,60);save()}
  else if(t.dataset.a){authVals[t.dataset.a]=t.value}
});
if(!restoreSession()){showApp(false);renderAuth()}
</script>
